name: Android CI

concurrency:
  group: word-divergence-main-signing
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Restore stable debug signing key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: word-divergence-debug-keystore-v1

      - name: Build debug APK
        run: ./gradlew --no-daemon -PciVersionCode=${{ github.run_number }} assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-divergence-debug
          path: app/build/outputs/apk/debug/app-debug.apk
