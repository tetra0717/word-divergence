name: Android CI

concurrency:
  group: word-divergence-main-signing
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Build debug APK
        run: ./gradlew --no-daemon -PciVersionCode=${{ github.run_number }} assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-divergence-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk word-divergence-debug.apk
          zip -j word-divergence-debug.zip word-divergence-debug.apk

          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest               --target "$GITHUB_SHA"               --title "Latest Android debug build"               --notes "Latest signed Android build of word-divergence. Install word-divergence-debug.apk directly on Android."
          fi

          gh release upload android-latest             word-divergence-debug.apk             word-divergence-debug.zip             --clobber
