plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.tetra.worddivergence'
    compileSdk = 36
    ndkVersion = '29.0.13113456'

    signingConfigs {
        debug {
            // Public development key committed on purpose.
            // It is NOT a production/release signing key.
            storeFile file('../debug/word-divergence-debug.keystore')
            storePassword 'worddivergence'
            keyAlias 'worddivergence'
            keyPassword 'worddivergence'
        }
    }

    defaultConfig {
        applicationId = 'com.tetra.worddivergence'
        minSdk = 33
        targetSdk = 36
        versionCode = (project.findProperty('ciVersionCode') ?: '1').toInteger()
        versionName = "0.2." + (project.findProperty('ciVersionCode') ?: '0')

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.31.6'
        }
    }
}


dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
