plugins {
    id 'com.android.application'
}

def usearchVersion = "2.26.2"
def usearchJar = file("lib/usearch-${usearchVersion}.jar")

tasks.register("downloadUSearchJar") {
    outputs.file(usearchJar)
    doLast {
        if (!usearchJar.exists()) {
            usearchJar.parentFile.mkdirs()
            def url = new URI("https://github.com/unum-cloud/USearch/releases/download/v${usearchVersion}/usearch-${usearchVersion}.jar").toURL()
            println("Downloading USearch ${usearchVersion} fat JAR...")
            url.withInputStream { input ->
                usearchJar.withOutputStream { output -> output << input }
            }
        }
    }
}

android {
    namespace = 'com.tetra.worddivergence'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.tetra.worddivergence'
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

tasks.named("preBuild").configure {
    dependsOn("downloadUSearchJar")
}

dependencies {
    implementation files(usearchJar)
}
