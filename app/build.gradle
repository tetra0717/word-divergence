plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.tetra.worddivergence'
    compileSdk = 36
    ndkVersion = '27.2.12479018'

    defaultConfig {
        applicationId = 'com.tetra.worddivergence'
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}
